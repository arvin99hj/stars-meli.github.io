<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050509">
    <title>Reflections — The Neighbourhood</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="universe">
        <div class="outer-ring"></div>
        <div class="outer-ring ring-two"></div>
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <canvas id="background"></canvas>

        <main id="constellation">
            <div class="intro" id="intro">
                <span class="intro-label">THE NEIGHBOURHOOD</span>
                <h1>Reflections</h1>
                <span class="intro-subtitle">A universe made of memories</span>
            </div>
        </main>

        <header class="top-bar">
            <div class="brand">R<span>.</span></div>
            <div class="song-info">
                <span>NOW PLAYING</span>
                <strong>Reflections</strong>
                <small>The Neighbourhood</small>
            </div>
        </header>

        <section class="player">
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <input type="range" id="progress" min="0" max="100" value="0">
                <span id="duration">0:00</span>
            </div>

            <div class="player-controls">
                <button id="restart" aria-label="Restart">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>

                <button id="play" class="play-button" aria-label="Play">
                    <svg id="play-icon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>

                <button id="volume-button" aria-label="Volume">
                    <svg viewBox="0 0 24 24">
                        <path d="M11 5 6 9H3v6h3l5 4z"/>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                    </svg>
                </button>

                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
            </div>

            <div class="player-footer">
                <span>MADE OF STARS</span>
                <button id="sync-toggle">LYRICS SYNC</button>
            </div>
        </section>

        <section class="sync-panel" id="sync-panel">
            <button id="close-sync" class="close-sync">×</button>
            <span class="panel-label">LYRICS EDITOR</span>
            <h2>Synchronize the stars.</h2>
            <p>Play the song and mark each word when you hear it.</p>
            <div class="sync-progress">
                <div id="sync-progress-fill"></div>
            </div>
            <div class="sync-count" id="sync-count">0 / 0 words synchronized</div>
            <div class="sync-current" id="sync-current">Ready to begin</div>
            <button id="mark-word" class="mark-button">MARK NEXT WORD</button>
            <div class="sync-actions">
                <button id="save-sync">SAVE TIMINGS</button>
                <button id="reset-sync">RESET</button>
            </div>
        </section>
    </div>

    <audio id="audio" src="assets/reflections.mp3" preload="metadata"></audio>

    <script src="script.js"></script>
</body>
</html>
